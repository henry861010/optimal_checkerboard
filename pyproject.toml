[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-checkerboard"
version = "0.1.0"
description = "2.5D checkerboard meshing utilities for rectangular advanced packaging geometries."
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
